# Shared taxonomy for scripts/skill_graph.py, which draws evidence/<company>/skill-graph.html.
#
# - areas: the colour groups. Colours are hex because vis-network cannot parse oklch().
# - tools: matched case-insensitively against each evidence file's `tools:` line, stopping at
#   "Studied, not used:". Each `match` is a regular expression; the default is the escaped name.
#   Tools left out of this list are not drawn (Python, NumPy, ruff and other noise).
# - keywords: matched case-insensitively against the Summary and What I Did sections only, never
#   "Not mine" or Summary's Remarks. Items with a caveat ("do not claim", "reverted") are
#   skipped too, so a keyword marks work the evidence says was the user's.
#
# Generic: no client names. Add a tool or keyword when a new evidence file needs one.

areas:
  cv: { label: Computer vision, color: "#e0533d" }
  llm: { label: LLM and AI infra, color: "#8b5cf6" }
  nlp: { label: Thai NLP, color: "#d99a0b" }
  ds: { label: Data science, color: "#3fa34d" }
  de: { label: Data engineering, color: "#1f7fd6" }
  devops: { label: DevOps and infra, color: "#6b7280" }
  be: { label: Backend, color: "#0e9a94" }
  fe: { label: Frontend and web, color: "#d9468f" }

