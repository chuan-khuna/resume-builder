[project]
name = "resume-builder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ALTR", email = "chuan.khuna@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "markdown-it-py>=3",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.4",
]

[project.scripts]
resume-builder = "resume_builder:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false # scripts only: nothing to build or install
